<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMNA People</title>

<style>
  :root {
    --n8n-orange: #ff6d5a;
    --n8n-orange-dark: #e85b49;
    --n8n-dark: #101010;
    --n8n-dark-2: #161616;
    --n8n-dark-3: #1f1f1f;
    --n8n-border: #303030;
    --n8n-text: #f5f5f5;
    --n8n-muted: #a7a7a7;
    --n8n-green: #35c759;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 20px;
    background:
      radial-gradient(circle at top, rgba(255, 109, 90, 0.08), transparent 35%),
      var(--n8n-dark);
    color: var(--n8n-text);
    min-height: 100vh;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(to bottom, black, transparent 80%);
  }

  h1 {
    font-size: 42px;
    line-height: 1.1;
    margin: 0 0 12px;
    font-weight: 700;
    letter-spacing: -1px;
    color: #fff;
  }

  h1::first-letter {
    color: var(--n8n-orange);
  }

  p {
    color: var(--n8n-muted);
    line-height: 1.6;
    margin-top: 0;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 13px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--n8n-border);
    color: var(--n8n-muted);
    font-size: 13px;
    font-weight: 600;
    margin: 8px 0 42px;
  }

  .badge::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #888;
    box-shadow: 0 0 8px rgba(136, 136, 136, 0.5);
  }

  .badge.on {
    background: rgba(53, 199, 89, 0.1);
    border-color: rgba(53, 199, 89, 0.35);
    color: #7be495;
  }

  .badge.on::before {
    background: var(--n8n-green);
    box-shadow: 0 0 10px rgba(53, 199, 89, 0.7);
  }

  .badge.off {
    background: rgba(255, 109, 90, 0.1);
    border-color: rgba(255, 109, 90, 0.35);
    color: #ff9b8d;
  }

  .badge.off::before {
    background: var(--n8n-orange);
    box-shadow: 0 0 10px rgba(255, 109, 90, 0.7);
  }

  h2 {
    font-size: 20px;
    margin: 0 0 14px;
    color: #fff;
    font-weight: 650;
  }

  #msgs {
    border: 1px solid var(--n8n-border);
    border-radius: 16px;
    padding: 18px;
    min-height: 160px;
    background: var(--n8n-dark-2);
    box-shadow:
      0 10px 40px rgba(0, 0, 0, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.02);
    margin-bottom: 14px;
  }

  .me {
    text-align: right;
    margin: 8px 0;
    padding: 10px 14px;
    margin-left: auto;
    max-width: 75%;
    width: fit-content;
    border-radius: 14px 14px 4px 14px;
    background: var(--n8n-orange);
    color: #fff;
    font-size: 14px;
    box-shadow: 0 5px 18px rgba(255, 109, 90, 0.18);
  }

  .bot {
    margin: 8px 0;
    padding: 11px 14px;
    max-width: 85%;
    width: fit-content;
    border-radius: 14px 14px 14px 4px;
    background: var(--n8n-dark-3);
    border: 1px solid var(--n8n-border);
    color: #e8e8e8;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 14px;
  }

  #ask {
    display: flex;
    gap: 10px;
    margin-bottom: 48px;
  }

  #q {
    flex: 1;
    min-width: 0;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--n8n-border);
    background: var(--n8n-dark-2);
    color: #fff;
    outline: none;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #q::placeholder {
    color: #777;
  }

  #q:focus {
    border-color: var(--n8n-orange);
    box-shadow: 0 0 0 3px rgba(255, 109, 90, 0.12);
  }

  #ask button {
    padding: 0 22px;
    border: none;
    border-radius: 10px;
    background: var(--n8n-orange);
    color: #fff;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 5px 20px rgba(255, 109, 90, 0.18);
  }

  #ask button:hover {
    background: var(--n8n-orange-dark);
    box-shadow: 0 7px 25px rgba(255, 109, 90, 0.28);
    transform: translateY(-1px);
  }

  #ask button:active {
    transform: translateY(0);
  }

  #applyLink,
  #coachLink {
    display: inline-flex;
    align-items: center;
    padding: 13px 18px;
    margin-top: 4px;
    border: 1px solid var(--n8n-border);
    border-radius: 10px;
    background: var(--n8n-dark-2);
    color: #f2f2f2;
    text-decoration: none;
    font-size: 14px;
    font-weight: 550;
    transition:
      border-color 0.2s,
      background 0.2s,
      transform 0.15s;
  }

  #applyLink:hover,
  #coachLink:hover {
    border-color: var(--n8n-orange);
    background: rgba(255, 109, 90, 0.07);
    transform: translateY(-1px);
  }

  a.disabled {
    pointer-events: none;
    opacity: .5;
  }

  @media (max-width: 600px) {
    body {
      padding: 32px 16px;
    }

    h1 {
      font-size: 34px;
    }

    #ask {
      flex-direction: column;
    }

    #ask button {
      min-height: 46px;
    }

    .me,
    .bot {
      max-width: 90%;
    }

    #applyLink,
    #coachLink {
      width: 100%;
      justify-content: center;
    }
  }
</style>
</head>

<body>

<h1>OMNA People</h1>
<p>Ask HR, get interview coaching, and apply. Built with n8n.</p>
<span class="badge" id="status">Checking…</span>

<h2>Ask HR</h2>
<div id="msgs"></div>

<form id="ask">
  <input id="q" placeholder="How many leave days do I get?" required>
  <button>Ask</button>
</form>

<h2>Apply or get coached</h2>
<p>
  <a id="applyLink" target="_blank" rel="noopener">Apply for a job</a>
  ·
  <a id="coachLink" target="_blank" rel="noopener">Get a coaching report</a>
</p>

<script>
const CONFIG = {
    n8nBase: "https://YOUR-DOMAIN.ngrok-free.app",
    chat: "/webhook/YOUR-CHAT-ID/chat",
    applyForm: "/form/YOUR-APPLY-FORM-ID",
    coachForm: "/form/YOUR-COACH-FORM-ID"
};

const $ = s => document.querySelector(s);
const sessionId = crypto.randomUUID();

const HEADERS = {
  "Content-Type": "application/json",
  "ngrok-skip-browser-warning": "1"
};

$("#applyLink").href = CONFIG.n8nBase + CONFIG.applyForm;
$("#coachLink").href = CONFIG.n8nBase + CONFIG.coachForm;

function setStatus(online) {
  $("#status").textContent = online ? "Online" : "Offline, please try again later";
  $("#status").className = "badge " + (online ? "on" : "off");

  document.querySelectorAll("#applyLink, #coachLink").forEach(a =>
    a.classList.toggle("disabled", !online)
  );
}

// Any answer from the chat webhook means n8n and ngrok are both running.
// When either is off, ngrok's error page has no CORS headers, so fetch fails.
async function checkStatus() {
  try {
    await fetch(CONFIG.n8nBase + CONFIG.chat, {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify({
        action: "loadPreviousSession",
        sessionId
      })
    });

    setStatus(true);
  } catch (err) {
    setStatus(false);
  }
}

checkStatus();

function add(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = text;
  $("#msgs").append(d);
  return d;
}

$("#ask").onsubmit = async e => {
  e.preventDefault();

  const q = $("#q").value.trim();
  $("#q").value = "";

  add("me", q);

  const bot = add("bot", "…");

  try {
    const r = await fetch(CONFIG.n8nBase + CONFIG.chat, {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify({
        action: "sendMessage",
        sessionId,
        chatInput: q
      })
    });

    if (!r.ok) throw new Error("HTTP " + r.status);

    bot.textContent = (await r.json()).output;
    setStatus(true);

  } catch (err) {
    bot.textContent = "The HR assistant is offline right now. Please try again later.";
    setStatus(false);
  }
};
</script>

</body>
</html>
